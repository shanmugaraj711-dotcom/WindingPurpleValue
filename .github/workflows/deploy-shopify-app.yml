name: Deploy CartLift to Shopify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@4.6.1

      - name: Install web pixel extension dependencies
        run: npm install --prefix extensions/cartlift-web-pixel --ignore-scripts

      - name: Reset Shopify CLI state and legacy auth
        run: |
          rm -rf .shopify
          unset SHOPIFY_CLI_PARTNERS_TOKEN
          unset SHOPIFY_CLI_AUTH_TOKEN
          unset SHOPIFY_API_KEY
          unset SHOPIFY_API_SECRET
          echo "Shopify CLI state cleared and legacy auth variables unset."

      # CI authentication is supplied only by the Shopify App Automation Token.
      # Pin the CartLift organization explicitly so non-interactive CI cannot
      # resolve the app against an unrelated or missing organization context.
      - name: Deploy app configuration and extensions
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_FLAG_ORGANIZATION_ID: "232482690"
        run: |
          if [ -z "$SHOPIFY_APP_AUTOMATION_TOKEN" ]; then
            echo "ERROR: SHOPIFY_APP_AUTOMATION_TOKEN is empty or unavailable."
            exit 1
          fi
          echo "SHOPIFY_APP_AUTOMATION_TOKEN is present."
          echo "Deploying CartLift against organization ${SHOPIFY_FLAG_ORGANIZATION_ID}."
          shopify app deploy --config production --allow-updates --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" --verbose
