name: Deploy CartLift to Shopify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@4.6.1

      - name: Install web pixel dependencies
        run: npm install --prefix extensions/cartlift-web-pixel --ignore-scripts

      - name: Verify production config
        run: |
          test -f shopify.app.production.toml
          grep -q '^client_id = "520369128d0be7253ef412e4727333b7"' shopify.app.production.toml
          grep -q '^application_url = "https://windingpurplevalue.pages.dev"' shopify.app.production.toml
          grep -q '^scopes = "read_products"' shopify.app.production.toml
          echo "CartLift production config verified."

      - name: Deploy CartLift app and extensions
        run: |
          if [ -z "$SHOPIFY_APP_AUTOMATION_TOKEN" ]; then
            echo "ERROR: SHOPIFY_APP_AUTOMATION_TOKEN is unavailable."
            exit 1
          fi
          shopify app deploy \
            --config production \
            --allow-updates \
            --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --verbose
