# CartLift production Shopify CLI app configuration.
# Production deployment intentionally reuses the same Shopify app/client.
name = "CartLift"
client_id = "520369128d0be7253ef412e4727333b7"
application_url = "https://windingpurplevalue.pages.dev"
embedded = true

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = [
  "https://windingpurplevalue.pages.dev/api/shopify/auth/callback"
]

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/shopify/webhooks"

# Shopify CLI's current remote validation can require an Events section even
# for apps that otherwise only use standard webhooks. Keep this minimal and
# use it only as a health signal; no customer data is processed here.
[events]
api_version = "unstable"

[[events.subscription]]
handle = "cartlift-product-update-health"
topic = "Product"
actions = ["update"]
uri = "/api/shopify/events"
