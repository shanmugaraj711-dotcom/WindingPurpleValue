# CartLift Shopify CLI app configuration.
# The Shopify Dev Dashboard client ID must be linked with `shopify app config link`
# before deploying this file to Shopify. Never commit the app secret.
name = "CartLift"
client_id = "REPLACE_WITH_SHOPIFY_CLIENT_ID"
application_url = "https://windingpurplevalue.pages.dev"
embedded = true

[access_scopes]
scopes = "read_products,read_metafields,write_metafields"

[auth]
redirect_urls = [
  "https://windingpurplevalue.pages.dev/api/shopify/auth/callback"
]

[build]
automatically_update_urls_on_dev = false
