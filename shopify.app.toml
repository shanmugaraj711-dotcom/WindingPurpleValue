# Shopify App Configuration
name = "CartLift"
client_id = "520369128d0be7253ef412e4727333b7"
application_url = "https://windingpurplevalue.pages.dev"
embedded = true

[access_scopes]
# Shopper analytics requires Shopify's Web Pixels API permissions.
scopes = "read_products,read_pixels,write_pixels,read_customer_events"

[auth]
redirect_urls = [
  "https://windingpurplevalue.pages.dev/api/shopify/auth/callback"
]

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/shopify/webhooks"

[events]
api_version = "unstable"

[[events.subscription]]
handle = "cartlift-product-update-health"
topic = "Product"
actions = ["update"]
uri = "/api/shopify/events"
